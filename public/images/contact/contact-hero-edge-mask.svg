<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1333" preserveAspectRatio="none">
  <defs>
    <filter id="rough-edge" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.018 0.012"
        numOctaves="3"
        seed="17"
        result="edge-noise"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="edge-noise"
        scale="52"
        xChannelSelector="R"
        yChannelSelector="G"
        result="rough-shape"
      />
      <feGaussianBlur in="rough-shape" stdDeviation="11" />
    </filter>
  </defs>
  <rect width="1000" height="1333" fill="black" fill-opacity="0" />
  <rect
    x="46"
    y="34"
    width="908"
    height="1265"
    rx="175"
    fill="white"
    filter="url(#rough-edge)"
  />
</svg>
